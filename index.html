<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip ke Bromo</title>
<style>
  :root{
    --bg:#0c0d13; --card:rgba(255,255,255,0.045); --card-hover:rgba(255,255,255,0.07);
    --border:rgba(255,255,255,0.09); --border-strong:rgba(255,255,255,0.18);
    --text:#f3efe6; --text-dim:#a7a3ad; --text-mute:#6f6c78;
    --sunrise:#e8793f; --sunrise2:#f4b860;
    --c-night:#8a7bc4; --c-dawn:#f4b860; --c-day:#6fa3d8; --c-dusk:#e8793f;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #241a3a 0%, transparent 60%), var(--bg);
    color:var(--text); font-family:var(--sans); padding:2.5rem 1.25rem 4rem;
  }
  .wrap{max-width:640px; margin:0 auto;}
  header{margin-bottom:1rem;}
  .eyebrow{ font-family:var(--mono); font-size:12px; letter-spacing:0.08em; color:var(--sunrise2); text-transform:uppercase; margin:0 0 8px; }
  h1{ font-weight:700; font-size:32px; margin:0 0 6px; line-height:1.15; }
  .title-input-h1{ font-family:var(--sans); font-weight:700; font-size:32px; line-height:1.15; color:var(--text); background:transparent; border:0.5px solid transparent; border-radius:8px; padding:2px 6px; margin:0 0 6px -6px; width:100%; max-width:420px; }
  .title-input-h1:hover, .title-input-h1:focus{ border-color:var(--border-strong); background:rgba(255,255,255,0.04); outline:none; }
  .title-row{display:flex; align-items:center; gap:8px;}
  .title-row h1{margin:0;}
  .title-edit-form{display:flex; flex-direction:column; gap:8px; margin-top:6px; max-width:420px;}
  .title-edit-form input[type="text"]{font-size:14px; padding:8px 10px;}
  .title-edit-actions{display:flex; gap:6px;}
  .ok-btn{color:#7bd39a; border-color:rgba(123,211,154,0.4);}
  .ok-btn:hover{background:rgba(123,211,154,0.12);}
  .x-btn{color:#f4a3a3; border-color:rgba(244,163,163,0.4);}
  .x-btn:hover{background:rgba(244,163,163,0.12);}
  .sub{color:var(--text-dim); font-size:14px; margin:0;}
  .topbar{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .live{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-dim); background:var(--card); border:0.5px solid var(--border); border-radius:20px; padding:6px 12px 6px 10px; white-space:nowrap; }
  .dot-live{width:7px; height:7px; border-radius:50%; background:#6fd08c; flex-shrink:0; animation:pulse 2s ease-in-out infinite;}
  .dot-live.off{background:#e2795a; animation:none;}
  #sync-time{color:var(--text-mute); font-family:var(--mono);}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}
  @media(prefers-reduced-motion:reduce){.dot-live{animation:none;}}

  .tabs{display:flex; gap:18px; margin:1.5rem 0 1.5rem; border-bottom:0.5px solid var(--border); flex-wrap:wrap;}
  .tab-btn{background:transparent; border:none; color:var(--text-dim); font-size:14px; padding:10px 2px; cursor:pointer; font-family:var(--sans); border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tab-btn.active{color:var(--text); border-bottom-color:var(--sunrise2); font-weight:500;}
  .panel[hidden]{display:none;}

  .startbox{ background:var(--card); border:0.5px solid var(--border); border-radius:14px; padding:14px 16px; margin:0 0 2rem; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .startbox label{font-size:13px; color:var(--text-dim);}
  input[type="datetime-local"], input[type="number"], input[type="text"], select{
    background:rgba(255,255,255,0.06); border:0.5px solid var(--border-strong);
    color:var(--text); border-radius:8px; padding:6px 10px; font-family:var(--mono); font-size:13px;
  }
  input[type="text"]{font-family:var(--sans);}
  select{font-family:var(--sans); padding:6px 8px;}
  input:focus, select:focus{ outline:none; border-color:var(--sunrise2); box-shadow:0 0 0 3px rgba(244,184,96,0.15); }
  input[type="number"]{width:56px;}

  .timeline{position:relative;}
  .rail{ position:absolute; left:78px; top:6px; bottom:6px; width:2px; background:var(--border-strong); border-radius:2px; z-index:0; }
  .day-header{ position:relative; z-index:2; background:var(--bg); padding:14px 0 10px; margin-left:-2px; display:flex; align-items:baseline; gap:10px; }
  .day-header .badge{ font-family:var(--mono); font-size:11px; color:#10121b; background:var(--sunrise2); border-radius:6px; padding:2px 7px; font-weight:500; }
  .day-header .label{font-weight:600; font-size:15px;}
  .day-header .line{flex:1; height:1px; background:var(--border);}

  .insert-row{ position:relative; z-index:2; display:flex; align-items:center; gap:10px; margin:2px 0 20px; }
  .insert-line{flex:1; height:1px; background:var(--border);}
  .insert-btn, .add-row-btn{ display:flex; align-items:center; gap:6px; background:var(--bg); border:1px dashed var(--border-strong); color:var(--text-dim); font-size:12.5px; padding:6px 14px; border-radius:20px; cursor:pointer; white-space:nowrap; font-family:var(--sans); }
  .insert-btn:hover, .add-row-btn:hover{border-color:var(--sunrise2); color:var(--sunrise2);}
  .add-row-btn{width:100%; justify-content:center; margin-top:8px;}

  .stop{position:relative; display:flex; gap:16px; padding-bottom:22px;}
  .stop.dragging{opacity:0.45;}
  .time-col{width:78px; flex-shrink:0; text-align:right; padding-right:22px; padding-top:1px;}
  .time-col .d{font-size:11px; color:var(--text-mute);}
  .time-col .t{font-family:var(--mono); font-size:14px; font-weight:500; color:var(--text); margin-top:2px;}
  .node{ position:absolute; left:78px; transform:translateX(-50%); top:4px; width:26px; height:26px; margin-top:-7px; border-radius:50%; background:var(--bg); border:2px solid var(--c-day); z-index:2; display:flex; align-items:center; justify-content:center; }
  .node svg{color:inherit;}
  .node.c-night{border-color:var(--c-night); color:var(--c-night);}
  .node.c-dawn{border-color:var(--c-dawn); color:var(--c-dawn);}
  .node.c-day{border-color:var(--c-day); color:var(--c-day);}
  .node.c-dusk{border-color:var(--c-dusk); color:var(--c-dusk);}
  .node.hero{box-shadow:0 0 0 5px rgba(232,121,63,0.18);}
  .content{flex:1; min-width:0;}
  .card{ background:var(--card); border:0.5px solid var(--border); border-radius:12px; padding:14px 16px; transition:background 0.15s; margin-bottom:1.1rem; }
  .card:hover{background:var(--card-hover);}
  .card.hero{border-color:rgba(244,184,96,0.35); background:rgba(244,184,96,0.06);}
  .card-header{font-weight:600; font-size:15px; margin-bottom:10px;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .title{font-weight:600; font-size:16px; margin:0 0 4px;}
  .blurb{font-size:13.5px; color:var(--text-dim); line-height:1.5; margin:0;}
  .toolbar{display:flex; gap:4px; flex-shrink:0;}
  .icon-btn{ background:transparent; border:0.5px solid var(--border); border-radius:7px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer; padding:0; flex-shrink:0; }
  .icon-btn:hover{background:rgba(255,255,255,0.08); color:var(--text);}
  .handle{cursor:grab; touch-action:none;}
  .dur-row{display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .dur-row label{font-size:11.5px; color:var(--text-mute); text-transform:uppercase; letter-spacing:0.03em;}
  .dur-row .unit{font-size:12px; color:var(--text-mute);}
  .next-hint{ font-family:var(--mono); font-size:12px; color:var(--sunrise2); background:rgba(244,184,96,0.1); border-radius:6px; padding:3px 8px; margin-left:auto; }

  .edit-form{display:flex; flex-direction:column; gap:8px;}
  .edit-form .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .edit-form input[type="text"]{flex:1; min-width:120px;}
  .edit-form .field-label{font-size:11px; color:var(--text-mute); text-transform:uppercase; letter-spacing:0.03em; width:100%;}
  .checkbox-row{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim);}
  .btn{ background:transparent; border:0.5px solid var(--border-strong); color:var(--text); border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; font-family:var(--sans); }
  .btn:hover{background:rgba(255,255,255,0.08);}
  .btn.primary{background:var(--sunrise2); color:#2c1c08; border-color:var(--sunrise2); font-weight:500;}
  .btn.primary:hover{background:var(--sunrise);}
  .btn.danger{color:#f4a3a3; border-color:rgba(244,163,163,0.35);}

  .cost-row, .check-row, .person-row{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:0.5px solid var(--border);}
  .cost-row:last-child, .check-row:last-child, .person-row:last-child{border-bottom:none;}
  .cost-item{padding:9px 0; border-bottom:0.5px solid var(--border);}
  .cost-item:last-child{border-bottom:none;}
  .cost-row-main{display:flex; align-items:center; gap:8px;}
  .cost-row-meta{display:flex; align-items:center; gap:8px; margin-top:7px; flex-wrap:wrap;}
  .cost-row-meta select{font-size:12px; padding:5px 8px;}
  .cost-row .c-title{flex:1; min-width:0;}
  .cost-row .c-amount{width:100px; text-align:right;}
  .check-row .chk-title{flex:1; min-width:0;}
  .check-row.done .chk-title{color:var(--text-mute); text-decoration:line-through;}
  .check-row input[type="checkbox"]{width:18px; height:18px; accent-color:var(--sunrise2); flex-shrink:0;}
  .person-row .pr-name{flex:1; min-width:0;}
  .person-row .pr-type{width:110px;}
  .badge-child{ font-size:11px; color:var(--sunrise2); background:rgba(244,184,96,0.12); padding:2px 8px; border-radius:10px; white-space:nowrap; }
  .totals-row{display:flex; justify-content:space-between; font-size:13.5px; padding:8px 0 0; color:var(--text-dim);}
  .totals-row.strong{font-weight:600; color:var(--text); font-size:15px; border-top:0.5px solid var(--border); margin-top:6px; padding-top:10px;}

  footer{margin-top:1rem; text-align:center; font-size:12px; color:var(--text-mute); display:flex; align-items:center; justify-content:center; gap:6px;}
  @media(max-width:480px){
    h1, .title-input-h1{font-size:26px;}
    .time-col{width:56px; padding-right:12px;}
    .rail, .node{left:56px;}
    .next-hint{margin-left:0;}
    body{padding:2rem 0.9rem 3rem;}
    .cost-row .c-amount{width:80px;}
    .person-row .pr-type{width:90px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <div>
        <p class="eyebrow" id="eyebrow-text">Rombongan · 7 orang</p>
        <div class="title-row" id="title-display-row">
          <h1 id="trip-title-display">Trip ke Bromo</h1>
          <button class="icon-btn" id="edit-title-btn" aria-label="Edit judul & deskripsi"></button>
        </div>
        <p class="sub" id="trip-desc-display">Jakarta → Magetan → Kediri → Batu → Bromo via Malang → Jakarta</p>
        <div id="title-edit-form" class="title-edit-form" style="display:none;">
          <input type="text" id="title-input-field" placeholder="Judul trip" />
          <input type="text" id="desc-input-field" placeholder="Deskripsi rute" />
          <div class="title-edit-actions">
            <button class="icon-btn ok-btn" id="title-save-btn" aria-label="Simpan"></button>
            <button class="icon-btn x-btn" id="title-cancel-btn" aria-label="Batal"></button>
          </div>
        </div>
      </div>
      <div class="live"><span class="dot-live" id="dot-live"></span><span id="sync-label">Menyambungkan…</span><span id="sync-time"></span></div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="itinerary">Itinerary</button>
      <button class="tab-btn" data-tab="costs">Biaya</button>
      <button class="tab-btn" data-tab="checklist">Checklist</button>
      <button class="tab-btn" data-tab="participants">Peserta</button>
    </div>
  </header>

  <div id="panel-itinerary" class="panel">
    <div class="startbox">
      <label for="start-input">Berangkat dari Jakarta</label>
      <input type="datetime-local" id="start-input" value="2026-08-21T21:00" />
    </div>
    <div class="timeline">
      <div class="rail"></div>
      <div id="timeline-root"></div>
    </div>
    <footer><span id="grip-icon-slot"></span>Tarik ikon titik untuk urutkan.</footer>
  </div>

  <div id="panel-costs" class="panel" hidden>
    <div class="card">
      <div class="card-header">Biaya bersama</div>
      <div id="shared-rows"></div>
      <button class="add-row-btn" id="add-shared-btn">+ Tambah biaya bersama</button>
      <div class="totals-row"><span>Total</span><span id="shared-total"></span></div>
      <div class="totals-row" id="shared-split-row"><span>Per orang dewasa</span><span id="shared-split"></span></div>
    </div>
    <div id="settlement-card"></div>
  </div>

  <div id="panel-checklist" class="panel" hidden>
    <div id="checklist-cards"></div>
  </div>

  <div id="panel-participants" class="panel" hidden>
    <div class="card">
      <div class="card-header">Daftar peserta</div>
      <div id="participant-rows"></div>
      <button class="add-row-btn" id="add-participant-btn">+ Tambah peserta</button>
    </div>
    <p class="sub" style="margin-top:-0.5rem;">Peserta "Anak" tidak ikut dihitung di pembagian biaya bersama.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAmilTPZl-_JcqGJYS84QDCQvQBxZp7MLY",
  authDomain: "bromo-trip.firebaseapp.com",
  databaseURL: "https://bromo-trip-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bromo-trip",
  storageBucket: "bromo-trip.firebasestorage.app",
  messagingSenderId: "630586084493",
  appId: "1:630586084493:web:b820cade22c49f6c34a6c4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ICON_PATHS = {
  travel: '<path d="M5 17h14M6 17a2 2 0 104 0M14 17a2 2 0 104 0M5 17V11l2-5h10l2 5v6"/>',
  stay: '<path d="M3 18v-6a2 2 0 012-2h5a2 2 0 012 2"/><path d="M3 18h18"/><path d="M21 18v-4a2 2 0 00-2-2h-5"/><path d="M3 11V7a2 2 0 012-2"/>',
  activity: '<path d="M12 21s-6-5.6-6-10a6 6 0 1112 0c0 4.4-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
  arrival: '<path d="M5 3v18"/><path d="M5 4h12l-2 4 2 4H5"/>',
  pencil: '<path d="M4 20h4L18 10l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  trash: '<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>',
  plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  check: '<path d="M4 12l5 5L20 6"/>',
  x: '<path d="M6 6l12 12"/><path d="M18 6L6 18"/>'
};
function iconSvg(name, size){
  size = size || 14;
  if (name === 'grip'){
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="5" r="1.7"/><circle cx="16" cy="5" r="1.7"/><circle cx="8" cy="12" r="1.7"/><circle cx="16" cy="12" r="1.7"/><circle cx="8" cy="19" r="1.7"/><circle cx="16" cy="19" r="1.7"/></svg>';
  }
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICON_PATHS[name] + '</svg>';
}
document.getElementById('grip-icon-slot').innerHTML = iconSvg('grip', 12);
document.getElementById('edit-title-btn').innerHTML = iconSvg('pencil', 14);
document.getElementById('title-save-btn').innerHTML = iconSvg('check', 14);
document.getElementById('title-cancel-btn').innerHTML = iconSvg('x', 14);

function uid(){ return "it-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function rp(n){ n = Math.round(n||0); return "Rp" + n.toLocaleString('id-ID'); }

// ---------- Global sync status ----------
let lastSyncAt = null;
function updateSyncMeta(){
  const slot = document.getElementById('sync-time');
  if (!slot) return;
  if (!lastSyncAt){ slot.textContent = ""; return; }
  const diffSec = Math.round((Date.now() - lastSyncAt.getTime()) / 1000);
  let text;
  if (diffSec < 10) text = "barusan";
  else if (diffSec < 60) text = diffSec + "d lalu";
  else if (diffSec < 3600) text = Math.floor(diffSec / 60) + "m lalu";
  else text = String(lastSyncAt.getHours()).padStart(2,"0") + "." + String(lastSyncAt.getMinutes()).padStart(2,"0");
  slot.textContent = "· " + text;
}
setInterval(updateSyncMeta, 15000);
function setStatus(text, ok){
  document.getElementById("sync-label").textContent = text;
  document.getElementById("dot-live").classList.toggle('off', !ok);
  if (ok && text.indexOf("Tersinkron") === 0){ lastSyncAt = new Date(); updateSyncMeta(); }
}

// ---------- Tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.hidden = true);
    btn.classList.add('active');
    document.getElementById('panel-' + btn.getAttribute('data-tab')).hidden = false;
  });
});

/* =====================================================
   META (judul trip)
===================================================== */
const metaRef = db.ref("bromo-meta");
let metaState = { title: "Trip ke Bromo", desc: "Jakarta → Magetan → Kediri → Batu → Bromo via Malang → Jakarta" };
let metaLastRaw = "";
let titleEditing = false;

function renderMeta(){
  document.getElementById('trip-title-display').textContent = metaState.title;
  document.getElementById('trip-desc-display').textContent = metaState.desc;
}
document.getElementById('edit-title-btn').addEventListener('click', () => {
  titleEditing = true;
  document.getElementById('title-input-field').value = metaState.title;
  document.getElementById('desc-input-field').value = metaState.desc;
  document.getElementById('title-display-row').style.display = 'none';
  document.getElementById('trip-desc-display').style.display = 'none';
  document.getElementById('title-edit-form').style.display = 'flex';
});
function closeTitleEdit(){
  titleEditing = false;
  document.getElementById('title-display-row').style.display = '';
  document.getElementById('trip-desc-display').style.display = '';
  document.getElementById('title-edit-form').style.display = 'none';
}
document.getElementById('title-cancel-btn').addEventListener('click', closeTitleEdit);
document.getElementById('title-save-btn').addEventListener('click', () => {
  metaState.title = document.getElementById('title-input-field').value.trim() || "Trip ke Bromo";
  metaState.desc = document.getElementById('desc-input-field').value.trim();
  renderMeta();
  closeTitleEdit();
  pushMeta();
});
function pushMeta(){
  metaLastRaw = JSON.stringify(metaState);
  metaRef.set(metaState);
}
let metaFirstLoad = true;
metaRef.on('value', snap => {
  const data = snap.val();
  if (!data || !data.title){ if (metaFirstLoad){ metaFirstLoad = false; pushMeta(); } return; }
  const raw = JSON.stringify(data);
  if (raw === metaLastRaw) return;
  metaLastRaw = raw; metaState = data;
  if (!titleEditing) renderMeta();
});
renderMeta();

/* =====================================================
   PARTICIPANTS
===================================================== */
const participantsRef = db.ref("bromo-participants");
const DEFAULT_PARTICIPANTS = [
  {id: uid(), name:"Icol", type:"dewasa"},
  {id: uid(), name:"Cindy", type:"dewasa"},
  {id: uid(), name:"Ega", type:"dewasa"},
  {id: uid(), name:"Maya", type:"dewasa"},
  {id: uid(), name:"Adit", type:"dewasa"},
  {id: uid(), name:"Devita", type:"dewasa"},
  {id: uid(), name:"Davi", type:"anak"}
];
let participantsState = { list: DEFAULT_PARTICIPANTS };
let participantsLastRaw = "";

function updateHeaderCount(){
  document.getElementById('eyebrow-text').textContent = 'Rombongan · ' + participantsState.list.length + ' orang';
}
function renderParticipants(){
  updateHeaderCount();
  const root = document.getElementById('participant-rows');
  root.innerHTML = participantsState.list.map(p =>
    '<div class="person-row" data-id="' + p.id + '">' +
      '<input type="text" class="pr-name" value="' + esc(p.name) + '" placeholder="Nama" />' +
      '<select class="pr-type"><option value="dewasa"' + (p.type==='dewasa'?' selected':'') + '>Dewasa</option><option value="anak"' + (p.type==='anak'?' selected':'') + '>Anak</option></select>' +
      '<button class="icon-btn pr-del" aria-label="Hapus">' + iconSvg('trash',14) + '</button>' +
    '</div>'
  ).join('');
  root.querySelectorAll('.pr-name').forEach(inp => inp.addEventListener('change', e => {
    const id = e.target.closest('.person-row').getAttribute('data-id');

].map(it => Object.assign({id: uid(), overrideStart:null}, it));

let itState = { start: "2026-08-21T21:00", items: INITIAL_ITEMS };
let itLastRaw = "";
let editingIds = new Set();
let draggingId = null;

const dayNames = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const dayShort = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const monthNames = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function fmtTime(date){ return String(date.getHours()).padStart(2,"0") + "." + String(date.getMinutes()).padStart(2,"0"); }
function dateKey(date){ return date.getFullYear()+"-"+date.getMonth()+"-"+date.getDate(); }
function fmtDayFull(date){ return dayNames[date.getDay()] + ", " + date.getDate() + " " + monthNames[date.getMonth()]; }
function fmtDayShort(date){ return dayShort[date.getDay()] + " " + date.getDate() + " " + monthNames[date.getMonth()]; }
function toLocalInputValue(date){
  const pad = n => String(n).padStart(2,"0");
  return date.getFullYear() + "-" + pad(date.getMonth()+1) + "-" + pad(date.getDate()) + "T" + pad(date.getHours()) + ":" + pad(date.getMinutes());
}
function timeClass(date){
  const h = date.getHours();
  if (h >= 5 && h < 7) return 'c-dawn';
  if (h >= 7 && h < 17) return 'c-day';
  if (h >= 17 && h < 19) return 'c-dusk';
  return 'c-night';
}
function computeTimes(){
  const items = itState.items;
  const times = [];
  let cur = new Date(itState.start);
  for (let i = 0; i < items.length; i++){
    if (i > 0 && items[i].overrideStart){ cur = new Date(items[i].overrideStart); }
    times.push(new Date(cur));
    cur = new Date(cur.getTime() + (items[i].duration || 0) * 3600000);
  }
  return times;
}
function insertRowHtml(idx){
  return '<div class="insert-row"><span class="insert-line"></span>' +
    '<button class="insert-btn" data-insert="' + idx + '">' + iconSvg('plus',13) + ' Tambah aktivitas</button>' +
    '<span class="insert-line"></span></div>';
}
function renderItinerary(){
  document.getElementById("start-input").value = itState.start;
  const items = itState.items;
  const times = computeTimes();
  const root = document.getElementById("timeline-root");
  let html = "";
  let lastDayKey = null, dayCount = 0;
  for (let i = 0; i < items.length; i++){
    const it = items[i];
    const startT = times[i];
    const key = dateKey(startT);
    if (key !== lastDayKey){
      dayCount++; lastDayKey = key;
      html += '<div class="day-header"><span class="badge">Hari ' + dayCount + '</span><span class="label">' + fmtDayFull(startT) + '</span><span class="line"></span></div>';
    }
    const isHero = !!it.hero;
    const hasNext = i < items.length - 1;
    let nextHint = "";
    if (hasNext){
      const endT = new Date(startT.getTime() + (it.duration||0) * 3600000);
      const sameDay = dateKey(endT) === dateKey(startT);
      nextHint = '<span class="next-hint">→ ' + (sameDay ? "" : fmtDayShort(endT) + " ") + fmtTime(endT) + '</span>';
    }
    html += '<div class="stop' + (draggingId===it.id ? ' dragging' : '') + '" data-id="' + it.id + '">' +
      '<div class="time-col"><div class="d">' + fmtDayShort(startT) + '</div><div class="t">' + fmtTime(startT) + '</div></div>' +
      '<div class="node ' + timeClass(startT) + (isHero ? ' hero' : '') + '">' + iconSvg(it.type, 13) + '</div>' +
      '<div class="content"><div class="card' + (isHero ? ' hero' : '') + '">';
    if (editingIds.has(it.id)){
      const startVal = it.overrideStart ? toLocalInputValue(new Date(it.overrideStart)) : toLocalInputValue(startT);
      html += '<div class="edit-form" data-edit-id="' + it.id + '">' +
        '<span class="field-label">Nama</span><input type="text" class="f-title" value="' + esc(it.title) + '" />' +
        '<span class="field-label">Deskripsi</span><input type="text" class="f-blurb" value="' + esc(it.blurb) + '" />' +
        '<div class="row"><div><span class="field-label">Jenis</span><select class="f-type">' +
          Object.keys(TYPE_LABELS).map(k => '<option value="' + k + '"' + (k===it.type?' selected':'') + '>' + TYPE_LABELS[k] + '</option>').join('') +
        '</select></div>' +
        (hasNext ? '<div><span class="field-label">Durasi (jam)</span><input type="number" step="0.5" min="0" class="f-duration" value="' + (it.duration||0) + '" /></div>' : '') +
        '</div>' +
        '<label class="checkbox-row"><input type="checkbox" class="f-override-chk"' + (it.overrideStart ? ' checked' : '') + ' />Atur jam & tanggal manual</label>' +
        '<input type="datetime-local" class="f-override-val" value="' + startVal + '" style="' + (it.overrideStart ? '' : 'display:none;') + '" />' +
        '<div class="row" style="margin-top:4px;"><button class="btn primary f-save">Simpan</button><button class="btn f-cancel">Batal</button><button class="btn danger f-delete" style="margin-left:auto;">Hapus</button></div>' +
      '</div>';
    } else {
      html += '<div class="card-top"><div><p class="title">' + esc(it.title) + '</p><p class="blurb">' + esc(it.blurb) + '</p></div>' +
        '<div class="toolbar"><button class="icon-btn f-edit-btn" aria-label="Edit">' + iconSvg('pencil',14) + '</button>' +
        '<button class="icon-btn f-del-btn" aria-label="Hapus">' + iconSvg('trash',14) + '</button>' +
        '<button class="icon-btn handle" aria-label="Urutkan">' + iconSvg('grip',14) + '</button></div></div>' +
        (hasNext ? '<div class="dur-row"><label>Durasi</label><input type="number" step="0.5" min="0" class="f-quick-duration" value="' + (it.duration||0) + '" /><span class="unit">jam</span>' + nextHint + '</div>' : '');
    }
    html += '</div></div></div>';
    const nextIsDifferentDay = hasNext && dateKey(times[i+1]) !== key;
    if (nextIsDifferentDay || !hasNext){ html += insertRowHtml(i + 1); }
  }
  root.innerHTML = html;
  attachItineraryHandlers();
}
function attachItineraryHandlers(){
  const root = document.getElementById("timeline-root");
  root.querySelectorAll('.f-quick-duration').forEach(inp => inp.addEventListener('change', e => {
    const id = e.target.closest('.stop').getAttribute('data-id');
    const it = itState.items.find(x => x.id === id);
    it.duration = parseFloat(e.target.value) || 0;
    renderItinerary(); pushItinerary();
  }));
  root.querySelectorAll('.f-edit-btn').forEach(btn => btn.addEventListener('click', e => {
    editingIds.add(e.target.closest('.stop').getAttribute('data-id')); renderItinerary();
  }));
  root.querySelectorAll('.f-del-btn').forEach(btn => btn.addEventListener('click', e => {
    const id = e.target.closest('.stop').getAttribute('data-id');
    itState.items = itState.items.filter(x => x.id !== id);
    editingIds.delete(id); renderItinerary(); pushItinerary();
  }));
  root.querySelectorAll('.f-override-chk').forEach(chk => chk.addEventListener('change', e => {
    e.target.closest('.edit-form').querySelector('.f-override-val').style.display = e.target.checked ? '' : 'none';
  }));
  root.querySelectorAll('.f-cancel').forEach(btn => btn.addEventListener('click', e => {
    editingIds.delete(e.target.closest('.edit-form').getAttribute('data-edit-id')); renderItinerary();
  }));
  root.querySelectorAll('.f-delete').forEach(btn => btn.addEventListener('click', e => {
    const id = e.target.closest('.edit-form').getAttribute('data-edit-id');
    itState.items = itState.items.filter(x => x.id !== id);
    editingIds.delete(id); renderItinerary(); pushItinerary();
  }));
  root.querySelectorAll('.f-save').forEach(btn => btn.addEventListener('click', e => {
    const form = e.target.closest('.edit-form');
    const id = form.getAttribute('data-edit-id');
    const it = itState.items.find(x => x.id === id);
    it.title = form.querySelector('.f-title').value.trim() || "Tanpa nama";
    it.blurb = form.querySelector('.f-blurb').value.trim();
    it.type = form.querySelector('.f-type').value;
    const durInput = form.querySelector('.f-duration');
    if (durInput) it.duration = parseFloat(durInput.value) || 0;
    const chk = form.querySelector('.f-override-chk');
    it.overrideStart = chk.checked ? new Date(form.querySelector('.f-override-val').value).toISOString() : null;
    editingIds.delete(id); renderItinerary(); pushItinerary();
  }));
  root.querySelectorAll('.insert-btn').forEach(btn => btn.addEventListener('click', e => {
    const idx = parseInt(e.currentTarget.getAttribute('data-insert'));
    const newItem = { id: uid(), type: "activity", title: "Aktivitas baru", blurb: "", duration: 1, overrideStart: null };
    itState.items.splice(idx, 0, newItem);
    editingIds.add(newItem.id); renderItinerary(); pushItinerary();
  }));
  root.querySelectorAll('.handle').forEach(handle => handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    draggingId = e.target.closest('.stop').getAttribute('data-id');
    renderItinerary();
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragEnd);
  }));
}
function onDragMove(e){
  if (!draggingId) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const stopEl = el && el.closest && el.closest('.stop');
  if (!stopEl) return;
  const overId = stopEl.getAttribute('data-id');
  if (overId && overId !== draggingId){
    const fromIdx = itState.items.findIndex(x => x.id === draggingId);
    const toIdx = itState.items.findIndex(x => x.id === overId);
    if (fromIdx > -1 && toIdx > -1 && fromIdx !== toIdx){
      const [moved] = itState.items.splice(fromIdx, 1);
      itState.items.splice(toIdx, 0, moved);
      renderItinerary();
    }
  }
}
function onDragEnd(){
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  draggingId = null; renderItinerary(); pushItinerary();
}
document.getElementById("start-input").addEventListener('change', (e) => {
  itState.start = e.target.value; renderItinerary(); pushItinerary();
});
function pushItinerary(){
  itLastRaw = JSON.stringify(itState);
  setStatus("Menyimpan…", true);
  itineraryRef.set(itState).then(() => setStatus("Tersinkron · tanpa login", true)).catch(() => setStatus("Gagal menyimpan", false));
}
let itFirstLoad = true;
itineraryRef.on('value', snap => {
  const data = snap.val();
  if (!data){
    if (itFirstLoad){ itFirstLoad = false; pushItinerary(); renderItinerary(); }
    return;
  }
  const normalized = { start: data.start || itState.start, items: Array.isArray(data.items) ? data.items : [] };
  const raw = JSON.stringify(normalized);
  if (raw === itLastRaw) return;
  if (draggingId || editingIds.size > 0) return;
  itLastRaw = raw; itState = normalized; renderItinerary();
  setStatus("Tersinkron · tanpa login", true);
}, () => setStatus("Tidak terhubung ke database", false));

function renderCosts(){

function attachCostHandlers(){
  document.querySelectorAll('.c-title').forEach(inp => inp.addEventListener('change', e => {
    const id = e.target.closest('.cost-item').getAttribute('data-id');
    costsState.shared.find(r => r.id === id).title = e.target.value.trim(); pushCosts();
  }));
  document.querySelectorAll('.c-amount').forEach(inp => inp.addEventListener('change', e => {
    const id = e.target.closest('.cost-item').getAttribute('data-id');
    costsState.shared.find(r => r.id === id).amount = parseFloat(e.target.value) || 0; renderCosts(); pushCosts();
  }));
  document.querySelectorAll('.c-del').forEach(btn => btn.addEventListener('click', e => {
    const id = e.target.closest('.cost-item').getAttribute('data-id');
    costsState.shared = costsState.shared.filter(r => r.id !== id); renderCosts(); pushCosts();
  }));
  document.querySelectorAll('.c-paidby').forEach(sel => sel.addEventListener('change', e => {
    const id = e.target.closest('.cost-item').getAttribute('data-id');
    costsState.shared.find(r => r.id === id).paidBy = e.target.value || null;
    renderCosts(); pushCosts();
  }));
}

function renderSettlement(){
  const adults = participantsState.list.filter(p => p.type === 'dewasa');
  const numAdults = adults.length;
  const totalShared = costsState.shared.reduce((s,r) => s + (Number(r.amount)||0), 0);
  const fairShare = numAdults > 0 ? totalShared / numAdults : 0;

  const paidMap = {};
  participantsState.list.forEach(p => { paidMap[p.id] = 0; });
  costsState.shared.forEach(r => { if (r.paidBy && paidMap.hasOwnProperty(r.paidBy)) paidMap[r.paidBy] += Number(r.amount)||0; });

  const balances = participantsState.list.map(p => {
    const owed = p.type === 'dewasa' ? fairShare : 0;
    return { name: p.name, type: p.type, paid: paidMap[p.id]||0, owed, net: (paidMap[p.id]||0) - owed };
  });

  // Hitung utang per item: tiap item displit rata ke semua orang dewasa,
  // lalu tiap orang (selain PIC item itu) berutang porsinya ke PIC tersebut.
  const nameById = {};
  participantsState.list.forEach(p => { nameById[p.id] = p.name; });
  const debtMap = {}; // ownerId -> { picId: amount }
  if (numAdults > 0){
    costsState.shared.forEach(item => {
      if (!item.paidBy) return;
      const share = (Number(item.amount)||0) / numAdults;
      adults.forEach(a => {
        if (a.id === item.paidBy) return;
        debtMap[a.id] = debtMap[a.id] || {};
        debtMap[a.id][item.paidBy] = (debtMap[a.id][item.paidBy] || 0) + share;
      });
    });
  }
  const transactions = [];
  // Netting: kalau dua orang sama-sama berutang satu sama lain (biasanya sesama PIC),
  // sisakan cuma selisihnya jadi satu arah saja.
  const involvedIds = new Set();
  Object.keys(debtMap).forEach(o => { involvedIds.add(o); Object.keys(debtMap[o]).forEach(p => involvedIds.add(p)); });
  const idList = Array.from(involvedIds);
  for (let i = 0; i < idList.length; i++){
    for (let j = i + 1; j < idList.length; j++){
      const a = idList[i], b = idList[j];
      const aOwesB = (debtMap[a] && debtMap[a][b]) || 0;
      const bOwesA = (debtMap[b] && debtMap[b][a]) || 0;
      if (aOwesB > 0 && bOwesA > 0){
        if (aOwesB > bOwesA){
          debtMap[a][b] = aOwesB - bOwesA;
          delete debtMap[b][a];
        } else if (bOwesA > aOwesB){
          debtMap[b][a] = bOwesA - aOwesB;
          delete debtMap[a][b];
        } else {
          delete debtMap[a][b];
          delete debtMap[b][a];
        }
      }
    }
  }
  Object.keys(debtMap).forEach(owerId => {
    Object.keys(debtMap[owerId]).forEach(picId => {
      const amt = debtMap[owerId][picId];
      if (amt > 500) transactions.push({ from: nameById[owerId] || "?", to: nameById[picId] || "?", amount: amt });
    });
  });
  transactions.sort((a,b) => a.from.localeCompare(b.from) || b.amount - a.amount);

  const balanceRows = balances.length ? balances.map(b =>
    '<div class="totals-row"><span>' + esc(b.name) + (b.type==='anak' ? ' <span class="badge-child">Anak</span>' : '') + '</span>' +
    '<span style="color:' + (b.net > 500 ? '#7bd39a' : (b.net < -500 ? '#f4a3a3' : 'var(--text-dim)')) + ';">' +
      (b.net > 500 ? '+' : '') + rp(b.net) +
    '</span></div>'
  ).join('') : '<p class="blurb">Belum ada peserta.</p>';

  const txRows = transactions.length ? transactions.map(t =>
    '<div class="totals-row"><span>' + esc(t.from) + ' → ' + esc(t.to) + '</span><span>' + rp(t.amount) + '</span></div>'
  ).join('') : '<p class="blurb">Belum ada yang perlu dilunasi.</p>';

  document.getElementById('settlement-card').innerHTML =
    '<div class="card"><div class="card-header">Saldo per orang</div>' + balanceRows +
      '<p class="blurb" style="margin-top:10px;">Hijau = sudah bayar lebih dari bagiannya (akan menerima). Merah = belum bayar bagiannya (perlu bayar).</p>' +
    '</div>' +
    '<div class="card"><div class="card-header">Cara pelunasan</div>' + txRows + '</div>';
}

            '<input type="text" class="chk-title" value="' + esc(row.title) + '" placeholder="Item persiapan" />' +
            '<select class="chk-assign">' +
              groups.map(g2 => '<option value="' + g2.id + '"' + (row.assignedTo===g2.id?' selected':'') + '>' + esc(g2.name) + '</option>').join('') +
            '</select>' +
            '<button class="icon-btn chk-del" aria-label="Hapus">' + iconSvg('trash',14) + '</button>' +
          '</div>'
        ).join('') +
      '</div>' +
      '<button class="add-row-btn add-check-row" data-group="' + g.id + '">' + iconSvg('plus',13) + ' Tambah item ' + esc(g.name) + '</button>' +
    '</div>';
  }).join('');

  root.querySelectorAll('.chk-done').forEach(cb => cb.addEventListener('change', e => {
    const id = e.target.closest('.check-row').getAttribute('data-id');
    checklistState.items.find(r => r.id === id).done = e.target.checked;
    renderChecklist(); pushChecklist();
  }));
  root.querySelectorAll('.chk-title').forEach(inp => inp.addEventListener('change', e => {
    const id = e.target.closest('.check-row').getAttribute('data-id');
    checklistState.items.find(r => r.id === id).title = e.target.value.trim();
    pushChecklist();
  }));
  root.querySelectorAll('.chk-assign').forEach(sel => sel.addEventListener('change', e => {
    const id = e.target.closest('.check-row').getAttribute('data-id');
    checklistState.items.find(r => r.id === id).assignedTo = e.target.value;
    renderChecklist(); pushChecklist();
  }));
  root.querySelectorAll('.chk-del').forEach(btn => btn.addEventListener('click', e => {
    const id = e.target.closest('.check-row').getAttribute('data-id');
    checklistState.items = checklistState.items.filter(r => r.id !== id);
    renderChecklist(); pushChecklist();
  }));
  root.querySelectorAll('.add-check-row').forEach(btn => btn.addEventListener('click', e => {
    const groupId = e.currentTarget.getAttribute('data-group');
    checklistState.items.push({ id: uid(), title: "", assignedTo: groupId, done: false });
    renderChecklist(); pushChecklist();
  }));
}
function pushChecklist(){
  checklistLastRaw = JSON.stringify(checklistState);
  setStatus("Menyimpan…", true);
  checklistRef.set(checklistState).then(() => setStatus("Tersinkron · tanpa login", true)).catch(() => setStatus("Gagal menyimpan", false));
}
let checklistFirstLoad = true;
checklistRef.on('value', snap => {
  const data = snap.val();
  if (!data){
    if (checklistFirstLoad){ checklistFirstLoad = false; pushChecklist(); renderChecklist(); }
    return;
  }
  const normalized = { items: Array.isArray(data.items) ? data.items : [] };
  const raw = JSON.stringify(normalized);
  if (raw === checklistLastRaw) return;
  checklistLastRaw = raw; checklistState = normalized; renderChecklist();
  setStatus("Tersinkron · tanpa login", true);
});

renderParticipants();
renderItinerary();
renderCosts();
renderChecklist();
</script>
</body>
</html>
